{% extends "base.html" %}
{% from "_macros.html" import icon with context %}

{% block title %}{{ code }} | {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="empty error-page">
  <span class="empty-emoji" aria-hidden="true">{{ "🔍" if code == 404 else "🙈" }}</span>
  <h1>{{ code }}</h1>
  <p>{{ message }}</p>
  <a class="button primary" href="{{ url_for('views.feed') }}">{{ icon("home") }}<span>Back to the feed</span></a>
</div>
{% endblock %}
