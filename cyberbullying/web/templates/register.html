{% extends "base.html" %}

{% block title %}Sign up | Cyberbullying Detection{% endblock %}

{% block content %}
<section class="narrow">
  <h1>Create an account</h1>
  <form method="post" class="card stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ username or '' }}" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" required autofocus>
      <span class="hint">3 to 20 letters, numbers or underscores</span>
    </label>
    <label>Password
      <input name="password" type="password" minlength="8" autocomplete="new-password" required>
      <span class="hint">At least 8 characters</span>
    </label>
    <label>Password again
      <input name="confirm" type="password" minlength="8" autocomplete="new-password" required>
    </label>
    {% if error %}<p class="blocked" role="alert">{{ error }}</p>{% endif %}
    <button>Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
</section>
{% endblock %}
