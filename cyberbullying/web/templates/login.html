{% extends "base.html" %}

{% block title %}Log in | Cyberbullying Detection{% endblock %}

{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  <form method="post" class="card stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    {% if error %}<p class="blocked" role="alert">{{ error }}</p>{% endif %}
    <button>Log in</button>
  </form>
  <p class="muted">Set up face login on your account page? <a href="{{ url_for('auth.face_login') }}">Log in with your face and PIN</a>.</p>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
</section>
{% endblock %}
